kind = "web"
previewPath = "/"
title = "개인 포트폴리오"
description = "자기소개, 기술 스택, 프로젝트, 경력과 학습 기록, 연락처를 한 곳에 담은 데스크톱 중심 개인 포트폴리오 웹사이트입니다."
version = "1.0.0"
id = "artifacts/personal-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20176

[services.development]
run = "pnpm --filter @workspace/personal-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/personal-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/personal-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20176"
BASE_PATH = "/"
